<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#070b18">
<title>哈士喵 · 决赛押宝夜 AVG</title>
<style>
:root{
  --bg:#070b18; --card:rgba(255,255,255,.045); --line:rgba(255,255,255,.10); --line2:rgba(255,255,255,.055);
  --txt:#eaf1ff; --dim:#8e9bb8; --dim2:#63708e;
  --blue:#35b6ff; --red:#ff5d6c; --purple:#b98bff; --gold:#ffd479; --green:#68e0a0;
  --safe:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
.hidden{display:none!important}
html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--txt);overflow:hidden}
body{font-family:"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei","WenQuanYi Micro Hei",system-ui,sans-serif}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.app{position:relative;max-width:520px;margin:0 auto;height:100%;overflow:hidden;isolation:isolate}
.bg{position:absolute;inset:0;z-index:-3;background-size:cover;background-position:center;
  transition:background-image .6s ease,opacity .6s}
.bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(7,11,24,.16),rgba(7,11,24,.52) 52%,rgba(7,11,24,.82) 84%,#070b18 100%)}
.gridlay{position:absolute;inset:0;z-index:-2;pointer-events:none;opacity:.30;
  background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);
  background-size:34px 34px;
  mask-image:linear-gradient(180deg,transparent,#000 30%,#000 70%,transparent);-webkit-mask-image:linear-gradient(180deg,transparent,#000 30%,#000 70%,transparent)}

/* ---------- HUD ---------- */
.hud{position:absolute;top:0;left:0;right:0;z-index:20;padding:12px 14px 10px;
  background:linear-gradient(180deg,rgba(7,11,24,.92),rgba(7,11,24,.55) 75%,transparent)}
.hud-r{display:flex;align-items:center;gap:9px}
.brand{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:0 0 auto;
  background:linear-gradient(135deg,var(--blue),var(--purple) 55%,var(--red));font-weight:900;font-size:15px;
  box-shadow:0 4px 16px rgba(53,182,255,.3)}
.brand img{width:22px;height:22px;border-radius:5px;mix-blend-mode:multiply}
.hud-t{flex:1;min-width:0}
.hud-t .a{font-size:13px;font-weight:800;letter-spacing:.4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud-t .b{font-size:9px;color:var(--dim2);letter-spacing:1.2px;margin-top:2px}
.coin{text-align:right;flex:0 0 auto}
.coin .n{font-size:18px;font-weight:900;color:var(--gold);font-variant-numeric:tabular-nums;line-height:1}
.coin .l{font-size:9px;color:var(--dim2);margin-top:2px;letter-spacing:1px}
.hud-b{display:flex;align-items:center;gap:7px;margin-top:9px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 8px;border-radius:999px;
  background:rgba(255,255,255,.05);border:1px solid var(--line2);font-size:9.5px;color:var(--dim);white-space:nowrap}
.chip b{color:var(--txt);font-variant-numeric:tabular-nums;font-weight:700}
.chip.live{border-color:rgba(255,93,108,.4);color:#ffb3bb}
.dot{width:5px;height:5px;border-radius:50%;background:var(--red);animation:pulse 1.6s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 6px rgba(255,93,108,0)}100%{box-shadow:0 0 0 0 rgba(255,93,108,0)}}
.chip .sp{flex:1}

/* ---------- stage ---------- */
#stage{position:absolute;inset:0;padding:78px 14px calc(10px + var(--safe));display:flex;flex-direction:column;overflow:hidden}
.sec-in{animation:fade .35s ease both}
@keyframes fade{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
.f1{flex:1;min-height:0}
.scroll-y{overflow-y:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.scroll-y::-webkit-scrollbar{display:none}

/* ---------- title ---------- */
.title-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;text-align:center;padding-bottom:10px}
.title-stamp{width:74px;height:74px;border-radius:16px;opacity:.92;margin-bottom:16px;mix-blend-mode:screen}
.title-k{font-size:10px;letter-spacing:3.5px;color:var(--purple);margin-bottom:12px}
.title-h{font-size:31px;font-weight:900;line-height:1.28;letter-spacing:1px;
  background:linear-gradient(90deg,var(--blue),#fff 48%,var(--red));-webkit-background-clip:text;background-clip:text;color:transparent}
.title-s{font-size:11px;color:var(--dim);line-height:1.9;margin-top:14px;max-width:290px}
.title-meta{margin-top:16px;font-size:9.5px;color:var(--dim2);letter-spacing:.6px;line-height:1.8}
.title-btns{display:grid;gap:9px;width:100%;max-width:280px;margin-top:22px}
.tbtn{height:46px;border-radius:13px;font-size:13px;font-weight:800;border:1px solid var(--line);background:rgba(255,255,255,.05)}
.tbtn.pri{background:linear-gradient(100deg,#0a6fd6,var(--blue) 45%,var(--purple));border-color:transparent;color:#fff;
  box-shadow:0 10px 28px rgba(53,182,255,.25)}
.tbtn:active{transform:scale(.98)}

/* ---------- portrait ---------- */
.portrait-wrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative;padding:4px 0 8px}
.pcard{position:relative;width:min(58vw,224px);aspect-ratio:3/4;border-radius:14px;overflow:hidden;
  border:1px solid rgba(255,255,255,.22);background:#111a30;
  box-shadow:0 20px 46px rgba(0,0,0,.55),0 0 0 5px rgba(255,255,255,.045);
  transition:transform .35s cubic-bezier(.2,.9,.3,1),opacity .3s}
.pcard img{position:absolute;inset:0;display:block;width:100%;height:100%}
.pcard #pBg{object-fit:cover;opacity:1}
.pcard #pImg{object-fit:cover}
.pcard.shake{animation:shake .42s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px) rotate(-1.2deg)}75%{transform:translateX(7px) rotate(1.2deg)}}
.pcard.pop{animation:pop .42s}
@keyframes pop{0%{transform:scale(.92);opacity:.4}100%{transform:scale(1);opacity:1}}

/* ---------- dialog ---------- */
.dlg{flex:0 0 auto;position:relative;border-radius:16px;padding:13px 14px 14px;min-height:112px;
  background:linear-gradient(150deg,rgba(18,26,48,.96),rgba(10,15,30,.96));
  border:1px solid rgba(255,255,255,.14);box-shadow:0 14px 36px rgba(0,0,0,.45);
  cursor:pointer;user-select:none;-webkit-user-select:none}
.dlg::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:3px;
  background:linear-gradient(180deg,var(--blue),var(--purple))}
.dlg .who{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;font-weight:900;letter-spacing:1px;
  color:var(--blue);background:rgba(53,182,255,.12);border:1px solid rgba(53,182,255,.28);
  padding:3px 9px;border-radius:7px;margin-bottom:9px}
.dlg .who.sys{color:var(--purple);background:rgba(185,139,255,.1);border-color:rgba(185,139,255,.3)}
.dlg .txt{font-size:13px;line-height:1.85;color:#e6edfb;min-height:48px;word-break:break-word}
.dlg .txt em{font-style:normal;color:var(--gold);font-weight:800}
.dlg .txt .b{color:var(--blue);font-weight:800}.dlg .txt .r{color:var(--red);font-weight:800}
.dlg .next{position:absolute;right:13px;top:13px;font-size:10px;color:var(--dim2);letter-spacing:1px}
.dlg .next.blink{animation:blink 1.1s infinite}
@keyframes blink{50%{opacity:.25}}
.choices{flex:0 0 auto;display:grid;gap:8px;margin-top:10px}
.choice{text-align:left;padding:11px 13px;border-radius:13px;font-size:12.5px;font-weight:700;line-height:1.5;
  border:1px solid var(--line);background:rgba(255,255,255,.045);transition:.18s}
.choice:active{transform:scale(.98)}
.choice .k{display:inline-block;margin-right:8px;color:var(--gold);font-weight:900;font-size:10px}
.choice.on{border-color:rgba(53,182,255,.6);background:rgba(53,182,255,.12)}

/* ---------- bet ---------- */
.bet-wrap{display:flex;flex-direction:column;height:100%;min-height:0}
.hostbar{flex:0 0 auto;display:flex;gap:10px;align-items:center;padding:9px 10px;margin-bottom:9px;border-radius:14px;
  background:rgba(255,255,255,.045);border:1px solid var(--line2)}
.hostbar .mini{width:52px;height:52px;border-radius:9px;overflow:hidden;flex:0 0 auto;background:#f2f2f0;border:1px solid rgba(255,255,255,.18)}
.hostbar .mini img{width:100%;height:100%;object-fit:cover}
.hostbar .say{flex:1;min-width:0}
.hostbar .say .n{font-size:9.5px;color:var(--purple);font-weight:900;letter-spacing:1px;margin-bottom:3px}
.hostbar .say .t{font-size:11px;line-height:1.55;color:#d9e3f7}
.bet-scroll{flex:1;min-height:0;padding-right:2px}
.bet-foot{flex:0 0 auto;padding-top:9px;border-top:1px solid var(--line2);margin-top:8px}
.unit-row{display:flex;align-items:center;gap:6px;margin-bottom:7px}
.unit-row .lab{font-size:10px;color:var(--dim);flex:0 0 auto;margin-right:2px}
.unit{flex:1;padding:7px 0;border-radius:10px;border:1px solid var(--line2);background:rgba(255,255,255,.035);
  font-size:11.5px;font-weight:800;color:var(--dim);font-variant-numeric:tabular-nums}
.unit.on{color:#fff;border-color:rgba(255,212,121,.55);background:rgba(255,212,121,.16)}
.slip{display:flex;align-items:center;gap:7px;font-size:10px;color:var(--dim);margin-bottom:8px;flex-wrap:wrap}
.slip .k{color:var(--txt);font-weight:800;font-variant-numeric:tabular-nums}
.slip .sep{flex:1;height:1px;background:var(--line2);min-width:8px}
.slip .clr{color:var(--dim2);text-decoration:underline;text-underline-offset:2px}
.go{width:100%;height:46px;border-radius:13px;font-size:13.5px;font-weight:900;letter-spacing:1px;
  background:linear-gradient(100deg,#0a6fd6,var(--blue) 42%,var(--purple) 74%,#d62b55);
  box-shadow:0 8px 24px rgba(53,182,255,.25);transition:transform .16s,filter .2s}
.go:active{transform:scale(.98)}
.go.dis{filter:grayscale(.6) brightness(.6);box-shadow:none}

.grp{margin-bottom:13px}
.grp-h{display:flex;align-items:center;gap:7px;margin:0 2px 8px}
.grp-h .no{width:18px;height:18px;border-radius:6px;display:grid;place-items:center;font-size:9px;font-weight:900;
  background:rgba(255,255,255,.07);border:1px solid var(--line2);color:var(--dim)}
.grp-h .t{font-size:12.5px;font-weight:800}
.grp-h .d{font-size:9.5px;color:var(--dim2);margin-left:auto;text-align:right}
.opts{display:grid;gap:7px;grid-template-columns:1fr 1fr 1fr}
.opt{position:relative;text-align:left;border-radius:12px;padding:9px 8px 8px;min-height:66px;
  border:1px solid var(--line2);background:rgba(255,255,255,.032);
  transition:transform .16s,border-color .2s,background .2s;cursor:pointer;user-select:none;-webkit-user-select:none}
.opt:active{transform:scale(.97)}
.opt .l{font-size:11px;font-weight:800;line-height:1.3;display:block;padding-right:13px}
.opt .s{font-size:9px;color:var(--dim2);line-height:1.3;display:block;margin-top:3px}
.opt .o{position:absolute;top:7px;right:7px;font-size:9px;font-weight:900;color:var(--gold);
  background:rgba(255,212,121,.1);border:1px solid rgba(255,212,121,.2);border-radius:5px;padding:1px 3px}
.opt.on{border-color:rgba(53,182,255,.7);background:linear-gradient(150deg,rgba(53,182,255,.2),rgba(53,182,255,.05))}
.opt.on .o{color:#fff;background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.22)}
.opt .stake{display:none;align-items:center;gap:2px;margin-top:7px}
.opt.on .stake{display:flex}
.opt .stake .amt{font-size:10px;font-weight:900;color:var(--gold);font-variant-numeric:tabular-nums;min-width:34px}
.opt .stake button{width:20px;height:19px;border-radius:6px;border:1px solid var(--line);
  background:rgba(0,0,0,.22);font-size:11px;font-weight:800;line-height:1;color:var(--dim)}
.opt.on .stake .rm{display:block;position:absolute;top:5px;right:6px;margin:0;padding:0;width:16px;height:16px;
  line-height:16px;text-align:center;font-size:12px;color:var(--dim);border-radius:4px;background:rgba(255,255,255,.07)}
.opt .stake .rm{display:none}
.grp.two .opts{grid-template-columns:1fr 1fr}
.grp.two .opt{min-height:62px}

/* ---------- live ---------- */
.live-top{flex:0 0 auto;display:flex;align-items:center;gap:8px;margin-bottom:8px}
.live-top .t{font-size:11px;font-weight:900;letter-spacing:1px}
.live-top .p{flex:1;height:4px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
.live-top .p i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--blue),var(--purple),var(--red));transition:width .4s}
.live-top .n{font-size:9.5px;color:var(--dim2);font-variant-numeric:tabular-nums}
.logline{flex:0 0 auto;max-height:64px;overflow:hidden;font-size:9.5px;color:var(--dim2);line-height:1.5;
  border-left:2px solid var(--line);padding-left:8px;margin-bottom:8px}
.logline b{color:var(--dim)}

/* ---------- result ---------- */
.res-hero{text-align:center;padding:16px 12px 14px;border-radius:18px;border:1px solid var(--line);
  background:linear-gradient(160deg,rgba(53,182,255,.1),rgba(185,139,255,.08) 55%,rgba(255,93,108,.1))}
.res-hero .cap{font-size:9.5px;color:var(--dim);letter-spacing:2px}
.res-hero .num{font-size:38px;font-weight:900;line-height:1.15;margin:6px 0 1px;font-variant-numeric:tabular-nums;
  background:linear-gradient(90deg,var(--gold),#fff 55%,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.res-hero .delta{font-size:11.5px;font-weight:800}
.res-hero .delta.up{color:var(--green)}.res-hero .delta.down{color:#ff8b95}
.res-hero .rank{display:inline-block;margin-top:10px;padding:5px 12px;border-radius:999px;font-size:11.5px;font-weight:900;
  background:rgba(255,212,121,.13);border:1px solid rgba(255,212,121,.35);color:var(--gold)}
.res-hero .rate{font-size:10px;color:var(--dim);margin-top:8px}
.score-line{display:flex;align-items:center;justify-content:center;gap:9px;margin-top:13px;font-size:11.5px;font-weight:800}
.score-line .b{color:var(--blue)}.score-line .r{color:var(--red)}
.score-line .v{font-size:19px;font-weight:900;color:#fff;font-variant-numeric:tabular-nums}
.sec-h{display:flex;align-items:baseline;gap:8px;margin:14px 2px 8px}
.sec-h .t{font-size:13px;font-weight:800}.sec-h .d{font-size:9.5px;color:var(--dim2)}
.rows{display:grid;gap:6px}
.row{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:11px;
  background:rgba(255,255,255,.032);border:1px solid var(--line2);font-size:10.5px}
.row .ic{width:18px;height:18px;border-radius:6px;flex:0 0 auto;display:grid;place-items:center;font-size:9.5px;font-weight:900}
.row .ic.y{background:rgba(104,224,160,.16);color:var(--green)}
.row .ic.n{background:rgba(255,93,108,.14);color:#ff8b95}
.row .m{flex:1;min-width:0}
.row .m .a{font-weight:700;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .m .b{font-size:9px;color:var(--dim2);margin-top:2px}
.row .v{font-weight:900;font-variant-numeric:tabular-nums;flex:0 0 auto}
.row .v.y{color:var(--green)}.row .v.n{color:var(--dim2)}
.quote{margin-top:11px;padding:12px 13px;border-radius:13px;border:1px dashed rgba(185,139,255,.35);
  background:rgba(185,139,255,.06);font-size:11.5px;line-height:1.8;color:#ded0ff}
.quote .q{font-size:9px;color:var(--purple);letter-spacing:1px;margin-bottom:5px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.btn{height:42px;border-radius:12px;font-size:11.5px;font-weight:800;border:1px solid var(--line);background:rgba(255,255,255,.05)}
.btn:active{transform:scale(.97)}
.btn.pri{background:linear-gradient(100deg,#0a6fd6,var(--purple));border-color:transparent;color:#fff}
.btn.full{grid-column:1/-1}
.share-wrap{margin-top:12px;text-align:center}
.share-wrap img{width:100%;max-width:270px;border-radius:14px;border:1px solid var(--line);display:block;margin:0 auto}
.share-wrap .h{font-size:9.5px;color:var(--dim2);margin-bottom:8px}
.foot-note{text-align:center;font-size:9px;color:var(--dim2);margin-top:10px;line-height:1.7}

/* ---------- tools / modal / toast ---------- */
.tools{display:flex;gap:5px;flex:0 0 auto;align-items:center}
.tool{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:rgba(10,16,32,.7);
  font-size:11px;font-weight:800;color:var(--dim);display:grid;place-items:center}
.toast{position:fixed;left:50%;top:96px;transform:translate(-50%,-10px);z-index:99;padding:9px 15px;border-radius:11px;
  font-size:11.5px;font-weight:700;white-space:nowrap;background:rgba(20,28,50,.96);border:1px solid var(--line);
  box-shadow:0 12px 30px rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:.25s;max-width:88vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.mask{position:fixed;inset:0;z-index:80;background:rgba(3,6,15,.8);backdrop-filter:blur(6px);display:none;
  align-items:flex-end;justify-content:center;padding:14px 14px calc(18px + var(--safe))}
.mask.show{display:flex}
.modal{width:100%;max-width:470px;max-height:78vh;overflow-y:auto;border-radius:18px;padding:17px;
  border:1px solid var(--line);background:linear-gradient(160deg,#141d36,#0b1122);box-shadow:0 24px 60px rgba(0,0,0,.6);
  animation:up .25s ease both;scrollbar-width:none}
.modal::-webkit-scrollbar{display:none}
@keyframes up{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
.modal h3{margin:0 0 11px;font-size:14px}
.modal p{margin:0 0 8px;font-size:11px;line-height:1.8;color:var(--dim)}
.modal p b{color:var(--txt)}
.modal .close{width:100%;height:40px;border-radius:11px;margin-top:10px;font-size:12px;font-weight:800;
  background:rgba(255,255,255,.07);border:1px solid var(--line)}
.logitem{padding:8px 10px;margin-bottom:6px;border-radius:10px;background:rgba(255,255,255,.04);
  border-left:2px solid rgba(53,182,255,.4);font-size:10.5px;line-height:1.7}
.logitem .w{font-size:9px;color:var(--purple);font-weight:900;letter-spacing:1px;margin-bottom:3px}

/* ===== 画面精修：回到样张的低饱和绘本调 + 光效层次 ===== */
:root{
  --bg:#14161c; --card:rgba(255,248,235,.055); --line:rgba(255,240,220,.14); --line2:rgba(255,240,220,.075);
  --txt:#f3ede2; --dim:#b3ab9e; --dim2:#807c74;
  --blue:#7fb4dd; --red:#e08284; --purple:#ab9ac9; --gold:#e7c283; --green:#8fd4a8;
}
html,body{background:var(--bg)}
.bg{filter:saturate(.88) brightness(.94)}
.bg::after{background:linear-gradient(180deg,rgba(18,19,24,.18),rgba(18,19,24,.44) 48%,rgba(16,17,22,.80) 82%,#14161c 100%)}
.bg::before{content:"";position:absolute;inset:-12%;pointer-events:none;opacity:.85;
  background:
    radial-gradient(circle at 20% 16%,rgba(231,194,131,.15),transparent 42%),
    radial-gradient(circle at 80% 28%,rgba(127,180,221,.13),transparent 46%),
    radial-gradient(2px 2px at 12% 24%,rgba(255,244,222,.55),transparent),
    radial-gradient(2px 2px at 34% 12%,rgba(255,244,222,.38),transparent),
    radial-gradient(2px 2px at 58% 32%,rgba(255,244,222,.42),transparent),
    radial-gradient(2px 2px at 76% 14%,rgba(255,244,222,.50),transparent),
    radial-gradient(2px 2px at 88% 44%,rgba(255,244,222,.35),transparent),
    radial-gradient(2px 2px at 24% 58%,rgba(255,244,222,.30),transparent),
    radial-gradient(2px 2px at 66% 66%,rgba(255,244,222,.28),transparent);
  animation:ambient 11s ease-in-out infinite alternate}
@keyframes ambient{0%{transform:translate3d(0,0,0) scale(1);opacity:.72}100%{transform:translate3d(-1.5%,1.2%,0) scale(1.05);opacity:1}}
.gridlay{opacity:.13}
.hud{background:linear-gradient(180deg,rgba(20,21,27,.80),rgba(20,21,27,.34) 78%,transparent);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.chip{background:rgba(255,246,230,.06);border-color:var(--line2)}
.brand{background:linear-gradient(135deg,#e7c283,#ab9ac9 55%,#e08284);box-shadow:0 4px 16px rgba(231,194,131,.26)}
.coin .n{color:var(--gold)}
.title-k{color:var(--gold)}
.title-h{background:linear-gradient(90deg,#e7c283,#fffaf0 48%,#e08284);-webkit-background-clip:text;background-clip:text}
.title-stamp{opacity:.88;filter:drop-shadow(0 6px 18px rgba(231,194,131,.34))}
.tbtn.pri{background:linear-gradient(100deg,#9a7442,#e7c283 48%,#ab9ac9);color:#20202a;
  box-shadow:0 10px 28px rgba(231,194,131,.22)}
/* 立绘卡：场景板 + 透明角色层，只有一只猫 */
.pcard{aspect-ratio:3/4;background:#22242c;border-radius:18px;
  border:1px solid rgba(255,244,224,.28);
  box-shadow:0 22px 52px rgba(0,0,0,.55),inset 0 0 0 1px rgba(255,244,224,.06),
             0 0 34px rgba(231,194,131,.14),0 0 0 6px rgba(255,246,230,.035);
  animation:float 5.5s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.pcard img{position:absolute;inset:0;display:block;width:100%;height:100%;object-fit:cover}
.pcard #pBg{filter:saturate(.86) brightness(.76)}
.pcard #pImg{z-index:2}
.pcard::after{content:"";position:absolute;inset:0;z-index:3;pointer-events:none;border-radius:18px;
  background:linear-gradient(180deg,rgba(255,246,230,.10),transparent 30%,transparent 66%,rgba(20,21,27,.30))}
.pcard.shake{animation:shake .42s}
.pcard.pop{animation:pop .42s}
/* 对白 / 选项 / 按钮柔光 */
.dlg{background:linear-gradient(150deg,rgba(30,31,38,.94),rgba(21,22,28,.94));
  border-color:rgba(255,240,220,.15);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  box-shadow:0 16px 40px rgba(0,0,0,.46),inset 0 1px 0 rgba(255,246,230,.08)}
.dlg::before{background:linear-gradient(180deg,var(--gold),var(--purple));box-shadow:0 0 12px rgba(231,194,131,.5)}
.dlg .who{color:#f0d9a8;background:rgba(231,194,131,.12);border-color:rgba(231,194,131,.3)}
.dlg .txt{color:#f0eade}
.dlg .txt em{color:var(--gold)}
.dlg .txt .b{color:var(--blue)}.dlg .txt .r{color:var(--red)}
.choice{background:rgba(255,246,230,.05);border-color:var(--line)}
.choice.on{border-color:rgba(231,194,131,.6);background:rgba(231,194,131,.12)}
.choice .k{color:var(--gold)}
.hostbar{background:rgba(255,246,230,.05);border-color:var(--line2)}
.hostbar .mini{background:#22242c;border-color:rgba(255,244,224,.2)}
.hostbar .mini img{object-fit:cover}
.hostbar .say .n{color:var(--gold)}
.opt{background:rgba(255,246,230,.035);border-color:var(--line2)}
.opt.on{border-color:rgba(231,194,131,.66);
  background:linear-gradient(150deg,rgba(231,194,131,.18),rgba(231,194,131,.04));
  box-shadow:0 0 18px rgba(231,194,131,.12)}
.opt .o{color:var(--gold)}
.opt.on .o{color:#fff}
.opt .stake .amt{color:var(--gold)}
.unit.on{color:#20202a;border-color:rgba(231,194,131,.6);background:rgba(231,194,131,.22)}
.go{background:linear-gradient(100deg,#9a7442,#e7c283 42%,#ab9ac9 74%,#b45f68);color:#20202a;
  box-shadow:0 10px 28px rgba(231,194,131,.24)}
.btn.pri{background:linear-gradient(100deg,#9a7442,#e7c283 55%,#ab9ac9);color:#20202a}
.res-hero{background:linear-gradient(160deg,rgba(231,194,131,.12),rgba(171,154,201,.08) 55%,rgba(224,130,132,.10));
  border-color:rgba(255,240,220,.16)}
.res-hero .num{background:linear-gradient(90deg,var(--gold),#fffaf0 55%,var(--gold));-webkit-background-clip:text;background-clip:text}
.res-hero .rank{background:rgba(231,194,131,.13);border-color:rgba(231,194,131,.35);color:var(--gold)}
.row{background:rgba(255,246,230,.035);border-color:var(--line2)}
.quote{background:rgba(171,154,201,.07);border-color:rgba(171,154,201,.3);color:#e8dcf5}
.quote .q{color:var(--purple)}
.modal{background:linear-gradient(160deg,#24252d,#171920);border-color:rgba(255,240,220,.16)}
.toast{background:rgba(30,31,38,.96)}
.tool{background:rgba(28,29,36,.75)}
.logline{border-left-color:rgba(231,194,131,.4)}
.live-top .p i{background:linear-gradient(90deg,var(--gold),var(--purple),var(--red))}

/* ===== 收尾：锁滚动 / 卡内提亮 / 标题主角 ===== */
html,body{position:fixed;inset:0;width:100%;height:100%;overscroll-behavior:none}
.pcard #pBg{filter:saturate(.90) brightness(.94)}
.title-cat{display:block;width:146px;height:180px;object-fit:contain;margin:0 auto 10px;
  filter:drop-shadow(0 14px 28px rgba(0,0,0,.48)) drop-shadow(0 0 26px rgba(231,194,131,.26));
  animation:float 5.5s ease-in-out infinite}

/* ===== 音效开关：默认关，开了才亮 ===== */
.tool.on{color:#20202a;background:linear-gradient(135deg,#e7c283,#ab9ac9);
  border-color:rgba(231,194,131,.55);box-shadow:0 0 12px rgba(231,194,131,.28);opacity:1}
.tool.off{opacity:.6}
#sfxBtn{font-size:14px;line-height:1}

/* ===== P0：规则速查 / 封盘摘要 ===== */
.p0-rules{margin:4px 0 10px}
.p0-rg{margin-bottom:9px;padding:8px 10px;border-radius:10px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07)}
.p0-rh{font-size:11px;font-weight:800;color:#ffd479;margin-bottom:5px}
.p0-rh span{font-weight:400;color:#8fa4c8;font-size:10px;margin-left:4px}
.p0-ro{display:flex;justify-content:space-between;gap:8px;font-size:10.5px;line-height:1.7;color:#dbe6fa}
.p0-ro b{color:#68e0a0;font-variant-numeric:tabular-nums;white-space:nowrap}
.p0-rc{font-size:9.5px;color:#8fa4c8;line-height:1.6;margin-top:4px}
.p0-sum{margin:6px 0 10px;padding:8px 10px;border-radius:10px;background:rgba(255,255,255,.04)}
.p0-sr{display:flex;justify-content:space-between;gap:8px;font-size:10.5px;line-height:1.9;color:#dbe6fa;border-bottom:1px dashed rgba(255,255,255,.07)}
.p0-sr:last-child{border-bottom:0}
.p0-sr b{color:#ffd479;white-space:nowrap;font-variant-numeric:tabular-nums}
.p0-btns{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.p0-btns .btn{width:100%;height:40px}

.modal .close.p0-sticky{position:sticky;bottom:-17px;z-index:2;background:#18233e;
  box-shadow:0 -10px 22px rgba(11,17,34,.92);border-color:rgba(255,255,255,.18)}
</style>
</head>

var WORLDS = {"source":"official_announcement_fallback","fetched_at":"2026-11-11T22:44:53+08:00","tournament":"2026 英雄联盟全球总决赛（S16）","stage":"冠亚军决赛","final":{"event_id":null,"start_cn":"2026-11-15 03:00","start_local":"2026-11-14 14:00 EST","start_utc":null,"venue":"Barclays Center, Brooklyn, New York","format":"BO5","state":"unstarted","teams":[{"code":"BLG","name":"Bilibili Gaming","league":"LPL","seed":"2 号种子"},{"code":"GEN","name":"Gen.G","league":"LCK","seed":"1 号种子"}],"teams_note":"媒体口径，最终以赛事方公布为准","winner":null,"score":null,"result":null},"note":"当前网络出口无法访问 lolesports API，使用官方公告口径的静态快照；赛果待 11.15 后回填"};

/* ===== B站 Toy 平台层 · 可插拔适配 =====
   当前挂 Local 实现（localStorage）。回头接 Toy：实现同名方法后
   调用 ToyAdapter.mount(ToyImpl) 即可，玩法代码一行都不用改。

   契约（board = 'practical' 实战榜 / 'demo' 虚拟推演榜）：
     name
     cloud.load(key,def) / cloud.save(key,val)
     leaderboard.submit(board,rec) / top(board,n) / boards()
     stamina.get() / spend(n) / restore(n) / max()
     limits.played(day) / mark(day) / max()
   适配层另提供 canPlay() / status() / today() / boardName()。          */
var ToyAdapter=(function(){
  var impl=null,P='hashimiao.toy.',STAM_MAX=3,DAY_MAX=3;
  function today(){var d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);}
  function rd(k,d){try{var v=localStorage.getItem(P+k);return v?JSON.parse(v):d;}catch(e){return d;}}
  function wr(k,v){try{localStorage.setItem(P+k,JSON.stringify(v));return true;}catch(e){return false;}}
  function rollover(){var d=today();if(rd('day',null)!==d){wr('day',d);wr('stamina',STAM_MAX);wr('played',0);}}
  function Local(){
    rollover();
    return {
      name:'local',
      cloud:{load:function(k,d){return rd('cloud.'+k,d);},save:function(k,v){return wr('cloud.'+k,v);}},
      leaderboard:{
        submit:function(board,rec){var a=rd('board.'+board,[]);a.push(rec);a.sort(function(x,y){return y.score-x.score;});return wr('board.'+board,a.slice(0,50));},
        top:function(board,n){return rd('board.'+board,[]).slice(0,n||10);},
        boards:function(){return ['practical','demo'];}
      },
      stamina:{
        get:function(){return rd('stamina',STAM_MAX);},
        spend:function(n){var v=rd('stamina',STAM_MAX)-n;if(v<0)return false;return wr('stamina',v);},
        restore:function(n){return wr('stamina',Math.min(STAM_MAX,rd('stamina',STAM_MAX)+n));},
        max:function(){return STAM_MAX;}
      },
      limits:{
        played:function(day){return rd('day',null)===day?rd('played',0):0;},
        mark:function(day){rollover();return wr('played',rd('played',0)+1);},
        max:function(){return DAY_MAX;}
      }
    };
  }
  var api={
    today:today,
    boardName:function(b){return b==='practical'?'实战榜':'虚拟推演榜';},
    mount:function(i){impl=i;return api;},
    ready:function(){return !!impl;},
    implName:function(){return impl?impl.name:'none';},
    cloud:{load:function(k,d){return impl?impl.cloud.load(k,d):d;},
           save:function(k,v){return impl?impl.cloud.save(k,v):false;}},
    leaderboard:{
      submit:function(b,r){return impl?impl.leaderboard.submit(b,r):false;},
      top:function(b,n){return impl?impl.leaderboard.top(b,n):[];},
      boards:function(){return impl?impl.leaderboard.boards():['practical','demo'];}
    },
    stamina:{
      get:function(){return impl?impl.stamina.get():0;},
      spend:function(n){return impl?impl.stamina.spend(n):false;},
      restore:function(n){return impl?impl.stamina.restore(n):false;},
      max:function(){return impl?impl.stamina.max():STAM_MAX;}
    },
    limits:{
      played:function(){return impl?impl.limits.played(today()):0;},
      mark:function(){return impl?impl.limits.mark(today()):false;},
      max:function(){return impl?impl.limits.max():DAY_MAX;}
    },
    canPlay:function(){
      if(api.limits.played()>=api.limits.max())return {ok:false,why:'今日 '+api.limits.max()+' 次已用完，明天再来'};
      if(api.stamina.get()<=0)return {ok:false,why:'体力不足，生成分享卡可回复 1 点'};
      return {ok:true};
    },
    status:function(){return api.stamina.get()+'/'+api.stamina.max()+' · 今日 '+api.limits.played()+'/'+api.limits.max();}
  };
  api.mount(Local());
  return api;
})();

function openBoard(){
  var h='<h3>排行榜 · 双榜</h3>';
  h+='<p style="font-size:11px;color:#8fa4c8;line-height:1.6">云存档 '+ToyAdapter.implName()+
     ' · 体力 '+ToyAdapter.status()+' · 每日 '+ToyAdapter.limits.max()+' 次</p>';
  ToyAdapter.leaderboard.boards().forEach(function(b){
    h+='<div style="margin-top:12px"><b style="color:#ffd479">'+ToyAdapter.boardName(b)+'</b>'+
       '<span style="font-size:10px;color:#8fa4c8"> · '+(b==='practical'?'真实赛果结算':'赛前模拟推演')+'</span></div>';
    var a=ToyAdapter.leaderboard.top(b,5);
    if(!a.length)h+='<p style="font-size:12px">还没有记录，先开演一轮。</p>';
    else a.forEach(function(r,i){
      var nm=String(r.name||'云观赛观众').replace(/&/g,'&amp;').replace(/</g,'&lt;');
      h+='<p style="margin:4px 0;font-size:12px">'+(i+1)+'. '+nm+
         ' · '+Number(r.score||0).toLocaleString('zh-CN')+' 币 · 命中 '+r.hit+'/'+(r.n||'?')+'</p>';
    });
  });
  h+='<p style="font-size:10px;color:#8fa4c8;margin-top:14px;line-height:1.6">榜单与体力当前存本地，页面不联网；接 B站 Toy 后由平台云存档 / 排行榜接管。</p>';
  h+='<button class="close" id="closeM">关闭</button>';
  document.getElementById('modal').innerHTML=h;
  document.getElementById('mask').classList.add('show');
  document.getElementById('closeM').onclick=function(){
    document.getElementById('mask').classList.remove('show');
  };
}

function load(){
  var fresh={balance:INIT,unit:100,picks:{},phase:'title',stance:null,result:null,feed:null,last:null,
             seen:false,log:[],shared:false,locked:null,schemaVersion:SCHEMA,buildId:BUILD_ID};
  try{
    var raw=localStorage.getItem(KEY);
    if(!raw)return fresh;
    var d=JSON.parse(raw);
    if(!d||typeof d!=='object'||Array.isArray(d))throw new Error('bad shape');
    if(typeof d.balance!=='number'||!isFinite(d.balance)||d.balance<0)throw new Error('bad balance');
    if(!d.picks||typeof d.picks!=='object'||Array.isArray(d.picks))throw new Error('bad picks');
    var t=0;
    for(var k in d.picks){
      if(!d.picks.hasOwnProperty(k))continue;
      var p=d.picks[k];
      if(!p||typeof p.id!=='string'||typeof p.stake!=='number'||!isFinite(p.stake)||p.stake<MIN)
        throw new Error('bad pick');
      t+=p.stake;
    }
    if(t>d.balance)throw new Error('overdraft');
    if(d.phase&&['title','bet','live','result'].indexOf(d.phase)<0)throw new Error('bad phase');
    if(d.locked&&typeof d.locked.at!=='number')d.locked=null;
    d.schemaVersion=SCHEMA;d.buildId=BUILD_ID;
    return d;
  }catch(e){
    try{localStorage.setItem(KEY+'.bad',localStorage.getItem(KEY)||'');}catch(e2){}
    fresh.__recovered=true;
    return fresh;
  }
}

function bindBet(){
  var sc=document.getElementById('betScroll');
  sc.addEventListener('click',function(e){
    var st=e.target.closest('[data-act]');
    if(st){
      e.stopPropagation();
      var act=st.dataset.act,gid=st.dataset.g,oid=st.dataset.o,p=S.picks[gid];
      if(!p||p.id!==oid)return;
      if(act==='remove'){delete S.picks[gid];toast('已撤销该项');}
      else if(act==='minus'){if(p.stake-STEP<MIN)toast('最低 '+MIN+' 币，点 × 可撤销');else p.stake-=STEP;}
      else if(act==='plus'){if(totalStake()+STEP>S.balance)toast('应援币不够啦');else p.stake+=STEP;}
      save();renderBet();return;
    }
    var opt=e.target.closest('.opt');
    if(opt){
      var g=groupById(opt.dataset.g),oid2=opt.dataset.o,cur=S.picks[g.id];
      if(cur&&cur.id===oid2){toast('已选中，卡片上可加减或撤销');return;}
      var delta=S.unit-(cur?cur.stake:0);
      if(totalStake()+delta>S.balance){toast('应援币不够啦，换个额度试试');return;}
      S.picks[g.id]={id:oid2,stake:S.unit};save();renderBet();return;
    }
  });
  sc.addEventListener('keydown',function(e){
    if(e.key!=='Enter'&&e.key!==' ')return;
    if(!e.target.classList||!e.target.classList.contains('opt'))return;
    e.preventDefault();e.target.click();
  });
  document.querySelector('.unit-row').addEventListener('click',function(e){
    var b=e.target.closest('[data-unit]');if(!b)return;
    var u=+b.dataset.unit,old=S.unit,bak=JSON.parse(JSON.stringify(S.picks));
    S.unit=u;for(var k in S.picks)if(S.picks.hasOwnProperty(k))S.picks[k].stake=u;
    if(totalStake()>S.balance){S.unit=old;S.picks=bak;toast('余额不够统一改成 '+u+' 币啦');}
    save();renderBet();
  });
  document.getElementById('goBtn').onclick=function(){
    if(S.locked){toast('已封盘，先完成本轮结算');return;}
    if(!pickCount()){toast('先押至少一项再封盘呀');return;}
    if(totalStake()>S.balance){toast('应援币不够啦');return;}
    goSummary();
  };
  var rb=document.getElementById('ruleBtn');if(rb)rb.onclick=openRules;
}

/* ================= 模拟赛果 & 战报 ================= */
function pick3(w){var r=Math.random();return r<w[0]?0:(r<w[0]+w[1]?1:2);}
function sideOr(alt,p){return Math.random()<p?alt:(Math.random()<0.5?'blue':'red');}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function sideKey(v){return v==='BLG'?'blue':(v==='GEN'?'red':v);}
function worldResult(){
  var f=(typeof WORLDS!=='undefined'&&WORLDS.final)||null;
  if(!f||!f.result)return null;
  var r=f.result,m=String(r.score||'').split(':');
  if(m.length!==2)return null;
  return {champion:sideKey(r.champion),score:r.score,bw:+m[0],rw:+m[1],
    firstblood:sideKey(r.firstblood),dragonflip:sideKey(r.dragonflip),
    baron:sideKey(r.firstbaron),fullseries:(+m[0] + +m[1]===5?'yes':'no'),
    demo:false,src:'WORLDS'};
}
function makeResult(){
  var real=worldResult();
  if(real)return real;                       // 快照已回填真实赛果 → 按真实结算
  var champ=Math.random()<0.5?'blue':'red',lose=pick3([0.22,0.38,0.40]);
  var bw=champ==='blue'?3:lose,rw=champ==='red'?3:lose;
  return {champion:champ,score:bw+':'+rw,bw:bw,rw:rw,
    firstblood:sideOr('peace',.06),dragonflip:sideOr('nobody',.28),baron:sideOr('baron',.07),
    fullseries:(bw+rw===5?'yes':'no'),demo:true,src:'demo'};
}
function hit(gid,oid,R){
  if(gid==='champion')return R.champion===oid;
  if(gid==='score')return R.score===oid;
  return R[gid]===oid;
}
function cheer(ev,side){
  var st=S.stance;
  if(!st)return rnd(['这一幕我先记下来。','又多一幕。','别眨眼，后面还有。']);
  if(st==='neutral')return rnd(['中立围观表示：两边都挺好。','我不站队，我只记剧本。','这波我先不表态。']);
  if(side&&side===st)return rnd(['看到了吗！我说的就是这个开局！','站稳了，这波我们站对了。','这波押对了，先别声张。']);
  if(side&&side!==st)return rnd(['……这剧本谁写的，站出来。','我先去喝口水，你别看我。','别慌，BO5 还长着呢（其实不长）。']);
  return rnd(['这一幕我先记下来。','又多一幕。']);
}

    }
  }
  add('五局','hot','host_hype','',R.fullseries==='yes'
      ?'<em>系列赛打满五局</em>，决胜局把整晚的灯牌都点着了。'

  /* P0：已押项逐条核对 —— 题目 / 你选 / 实际 / 命中 / 得分，叙事层服务结算 */
  var P=(S.locked&&S.locked.picks)||S.picks,cnt=0;
  GROUPS.forEach(function(g){
    var p=P[g.id];if(!p)return;
    var o=optById(g,p.id);if(!o)return;
    var yes=hit(g.id,p.id,R),gain=yes?Math.round(p.stake*o.o):0;

      '<b>你押</b> '+esc(o.l)+'（'+fmt(p.stake)+' 币 · x'+o.o.toFixed(2)+'） → <b>实际</b> '+esc(actualText(g.id,R))+
      ' → '+(yes?'<em>命中 +'+fmt(gain)+' 币</em>':'<em>未中 −'+fmt(p.stake)+' 币</em>'),
      yes?'这题算你赢，记一笔。':'这题先记着，下轮再说。','CLOUD WATCH / 核对',String(cnt));
  });
  if(cnt)add('核对完毕','hot','host_idle','','<em>'+cnt+' 项押注已逐条核对</em>，下面进入结算。','翻页吧。');
  return f;
}
function startLive(){
  var gate=ToyAdapter.canPlay();
  if(!gate.ok){toast(gate.why);S.phase='bet';save();renderBet();return;}
  try{ToyAdapter.limits.mark();ToyAdapter.stamina.spend(1);}catch(e){}
  S.shared=false;
  S.result=makeResult();S.feed=buildFeed(S.result);S.phase='live';save();
  updCoin();setBG('bg_moon');
  play(S.feed,'终章 · 战报',null,true);
}

/* ================= 结算 ================= */
function settle(){
  var R=S.result;
  if(!R)return;
  /* P0：重放保护 —— 同一封盘 + 同一赛果只结算一次 */
  var token=(S.locked?S.locked.at:'nolock')+':'+(R.src||'demo')+':'+(R.score||'');
  if(S.last&&S.last.token===token&&S.phase==='result'){renderResult();return;}
  var P=(S.locked&&S.locked.picks)||S.picks,rows=[],back=0,hitN=0,t=0;
  GROUPS.forEach(function(g){
    var p=P[g.id];if(!p)return;
    var o=optById(g,p.id);if(!o)return;
    t+=p.stake;
    var yes=hit(g.id,p.id,R),gain=yes?Math.round(p.stake*o.o):0;
    if(yes){hitN++;back+=gain;}
    rows.push({g:g.title,o:o.l,stake:p.stake,odds:o.o,yes:yes,gain:gain});
  });
  var before=(S.locked?S.locked.balanceBefore:S.balance),after=before-t+back;
  S.balance=after;S.phase='result';
  S.last={rows:rows,t:t,back:back,hitN:hitN,n:rows.length,before:before,after:after,R:R,
          token:token,buildId:BUILD_ID,version:versionTag(),locked:!!S.locked};
  save();
  try{
    var board=(R.src==='WORLDS'?'practical':'demo');
    var rec={name:'云观赛观众',score:after,hit:hitN,n:rows.length,ts:Date.now(),src:R.src,board:board};
    ToyAdapter.leaderboard.submit(board,rec);
    ToyAdapter.cloud.save('lastResult',rec);
    ToyAdapter.cloud.save('state',{balance:after,stance:S.stance,
      stamina:ToyAdapter.stamina.get(),day:ToyAdapter.today(),played:ToyAdapter.limits.played()});
  }catch(e){}
  renderResult();
}
function rankOf(L){
  var p=L.after-L.before;
  if(L.after<=0)return '倾家荡产但很快乐';
  if(L.R.champion===S.stance&&L.hitN===L.n&&L.n>0)return '全场最懂球';
  if(L.hitN===0)return '反向明灯 · 官方指定';
  if(p>=L.t*2)return '押宝仙人 · 天命所归';
  if(p>0)return '小赚不亏 · 懂球帝';
  if(p===0)return '精准白给 · 气氛组';
  if(p>=-L.t*.5)return '气氛组组长';
  return '嘴硬型观众';
}
function endingLine(L){
  var st=S.stance;
  if(st==='neutral')return '两边都不站，反而把整晚看得最清楚，今晚记住了。';
  if(L.R.champion===st)return '开场那句站队，和终场这块比分牌，今晚对上了。';
  return '立场是立场，赛果是赛果。两样都留着，下轮接着嘴硬。';
}

function roundRect(x,l,t,w,h,r){
  x.beginPath();x.moveTo(l+r,t);x.lineTo(l+w-r,t);x.quadraticCurveTo(l+w,t,l+w,t+r);
  x.lineTo(l+w,t+h-r);x.quadraticCurveTo(l+w,t+h,l+w-r,t+h);x.lineTo(l+r,t+h);
  x.quadraticCurveTo(l,t+h,l,t+h-r);x.lineTo(l,t+r);x.quadraticCurveTo(l,t,l+r,t);x.closePath();
}

function ensure(){
  if(ctx||noCtx)return ctx;
  var AC=window.AudioContext||window.webkitAudioContext;
  if(!AC){noCtx=true;return null;}
  try{
    ctx=new AC();
    master=ctx.createGain();master.gain.value=.16;master.connect(ctx.destination);
  }catch(e){ctx=null;noCtx=true;}
  return ctx;
}
function env(g,t,dur,peak){
  g.gain.setValueAtTime(.0001,t);
  g.gain.exponentialRampToValueAtTime(peak,t+.012);
  g.gain.exponentialRampToValueAtTime(.0001,t+dur);
}
function tone(c,f,dur,type,vol,delay,slide){
  var t=c.currentTime+(delay||0);
  var o=c.createOscillator(),g=c.createGain();
  o.type=type||'sine';
  o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+dur);
  env(g,t,dur,vol);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.02);
}
function noise(c,dur,vol,freq,delay){
  var t=c.currentTime+(delay||0);
  var len=Math.max(1,Math.ceil(c.sampleRate*dur));
  var buf=c.createBuffer(1,len,c.sampleRate),d=buf.getChannelData(0);
  for(var i=0;i<len;i++)d[i]=(Math.random()*2-1)*(1-i/len);
  var s=c.createBufferSource();s.buffer=buf;
  var f=c.createBiquadFilter();f.type='bandpass';f.frequency.setValueAtTime(freq||900,t);f.Q.value=.8;
  var g=c.createGain();env(g,t,dur,vol);
  s.connect(f);f.connect(g);g.connect(master);s.start(t);s.stop(t+dur+.02);
}

  tap:function(c){tone(c,620,.055,'sine',.45,0,780);},
  coin:function(c){tone(c,880,.09,'triangle',.42);tone(c,1320,.10,'sine',.26,.055);},
  select:function(c){tone(c,480,.07,'triangle',.36,0,560);},
  tick:function(c){tone(c,1400,.018,'square',.10);},
  scene:function(c){noise(c,.22,.18,620);tone(c,330,.20,'sine',.10);},
  confirm:function(c){[392,494,587].forEach(function(f,i){tone(c,f,.30,'sine',.24,i*.035);});},
  win:function(c){[523,659,784,1047].forEach(function(f,i){tone(c,f,.14,'triangle',.34,i*.085);});},
  lose:function(c){tone(c,392,.22,'sine',.30);tone(c,294,.28,'sine',.28,.14);},
  share:function(c){[784,1047,1319].forEach(function(f,i){tone(c,f,.12,'sine',.26,i*.06);});noise(c,.18,.10,2600,.12);},
  toggle:function(c){tone(c,740,.08,'sine',.36,0,980);}
};
function play(name){
  if(!enabled||!unlocked||!B[name])return;
  var c=ensure();if(!c)return;
  try{if(c.state==='suspended'&&c.resume){var p=c.resume();if(p&&p.catch)p.catch(function(){});}}catch(e){}
  try{B[name](c);}catch(e){}
}
function toggle(){
  enabled=!enabled;
  if(enabled)unlocked=true;
  try{localStorage.setItem(KEY,enabled?'1':'0');}catch(e){}
  syncBtn();
  if(enabled){play('toggle');toastMsg('音效已开启 ♪');}
  else{toastMsg('音效已关闭');}
}
if(btn){
  syncBtn();
  btn.addEventListener('click',function(e){e.stopPropagation();e.preventDefault();toggle();});
}
document.addEventListener('click',function(e){
  unlocked=true; /* 任意用户手势才解锁，刷新页面不自动出声 */
  var t=e.target;if(!t||!t.closest||!enabled)return;
  if(t.closest('#sfxBtn'))return;
  if(t.closest('[data-act]')){play('coin');return;}
  if(t.closest('.opt')){play('select');return;}
  if(t.closest('#goBtn')){play('confirm');return;}
  if(t.closest('#shareBtn')||t.closest('#dlBtn'))return;
  if(t.closest('#dlg')||t.closest('#pw')){
    var n=Date.now();if(n-lastTap>60){lastTap=n;play('tap');}return;
  }
  if(t.closest('.choice')||t.closest('#startBtn')||t.closest('.btn')||t.closest('.tool')||
     t.closest('.tbtn')||t.closest('[data-unit]')||t.closest('.close')){
    var m=Date.now();if(m-lastTap>60){lastTap=m;play('tap');}
  }
},true);
function scan(){
  if(!enabled)return;
  var now=Date.now();
  var lg=document.getElementById('logline');
  if(lg){
    var v=lg.textContent||'';
    if(v!==lastLog){lastLog=v;if(now-lastTick>110){lastTick=now;play('tick');}}
  }else lastLog='';
  var bgel=document.querySelector('.bg');
  if(bgel){
    var bi=bgel.style.backgroundImage||'';
    if(bi&&bi!==lastBg){lastBg=bi;if(now-lastScene>500){lastScene=now;play('scene');}}
  }
  var res=document.querySelector('.res-hero');
  if(res&&!hadResult){
    hadResult=true;
    var d=res.querySelector('.delta');
    play(d&&d.className.indexOf('up')>=0?'win':'lose');
  }else if(!res)hadResult=false;
  var si=document.getElementById('shareImg');
  if(si){
    var ss=si.getAttribute('src')||'';
    if(ss&&ss!==lastShare){lastShare=ss;play('share');}
  }else lastShare='';
}
if(window.MutationObserver){
  try{
    var mo=new MutationObserver(function(){try{scan();}catch(e){}});
    mo.observe(document.body,{childList:true,subtree:true,characterData:true,
      attributes:true,attributeFilter:['style','src']});
  }catch(e){}
}else{
  try{setInterval(function(){scan();},120);}catch(e){}
}
window.SFX={
  play:play,toggle:toggle,scan:scan,
  on:function(){if(!enabled)toggle();},
  off:function(){if(enabled)toggle();},
  get enabled(){return enabled;},
  get unlocked(){return unlocked;},
  get ctxCreated(){return !!ctx;},
  get supported(){return !!(window.AudioContext||window.webkitAudioContext);}
};
})();
</script>
